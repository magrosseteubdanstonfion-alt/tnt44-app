name: Compiler l'APK TNT44

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Utiliser la clé de signature du dépôt
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Compiler
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TNT44.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TNT44-apk
          path: TNT44.apk

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TNT44.apk --title "TNT44 1.0.${{ github.run_number }}" --notes "Dernière compilation de TNT44 pour Android. Télécharge TNT44.apk sur ton téléphone ou ta tablette, puis ouvre-le pour l'installer."
