<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1c20">
<title>TNT44</title>
<script src="jszip.min.js"></script>
<style>@font-face{font-family:"Chakra Petch";font-weight:500;src:url(fonts/ChakraPetch-Medium.ttf)}
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(fonts/ChakraPetch-Bold.ttf)}
@font-face{font-family:"Saira Condensed";font-weight:500;src:url(fonts/SairaCondensed-Medium.ttf)}
@font-face{font-family:"Saira Condensed";font-weight:700;src:url(fonts/SairaCondensed-Bold.ttf)}
@font-face{font-family:"Saira Stencil One";font-weight:400;src:url(fonts/SairaStencilOne-Regular.ttf)}

/* Layout : une seule façade d'instrument, dimensionnée en em (1em = 1% de sa largeur) pour garder ses proportions à toute taille. */
:root{
  color-scheme:dark;
  --page:#0e0e11; --case:#1c1c20; --case-hi:#2b2b30; --key:#27272c; --key-lo:#17171a;
  --ink:#dedad2; --dim:#8d897f; --screen:#0a0c11; --line:#262a33;
  --red:#ff3b2f; --amber:#ffb020; --cyan:#19d3e6; --mag:#ff2fa0; --green:#3ddc6a;
  --f-logo:"Saira Stencil One","Impact",sans-serif;
  --f-label:"Saira Condensed","Arial Narrow",sans-serif;
  --f-screen:"Chakra Petch","Trebuchet MS",sans-serif;
}
body{background:var(--page);color:var(--ink);font-family:var(--f-label);padding-inline:16px;padding-block:20px}
.stage{container-type:inline-size;max-width:1180px;margin:0 auto}
.dev{font-size:1cqw;padding:2.2em 2.5em;border-radius:1.6em;background:linear-gradient(160deg,var(--case-hi),var(--case) 30%);
  box-shadow:inset 0 .12em 0 var(--case-hi),0 2em 4em -1em #000;display:grid;gap:1.4em;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer}
:focus-visible{outline:.2em solid var(--amber);outline-offset:.15em}

/* boutons */
.btn{background:linear-gradient(var(--key),var(--key-lo));border-radius:.35em;height:3em;display:grid;place-items:center;
  box-shadow:0 .15em 0 #000,inset 0 .08em 0 var(--case-hi);min-width:0}
.btn span{font-size:.72em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1;text-align:center}
.btn:active{transform:translateY(.1em);box-shadow:inset 0 .1em .3em #000}
.btn[data-c=red] span{color:var(--red)} .btn[data-c=amber] span{color:var(--amber)} .btn[data-c=green] span{color:var(--green)}
.btn.on{background:var(--ink)} .btn.on span{color:var(--key-lo)}
.btn.q span{color:var(--amber)}

/* haut */
.top{display:grid;grid-template-columns:8em 1fr 7em;gap:1.3em;align-items:center}
.ctl{display:grid;justify-items:center;gap:.5em}
.ctl small,.sub{font-size:.62em;font-weight:700;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;text-align:center;line-height:1}
.rows{display:grid;gap:.6em}
.r16{display:grid;grid-template-columns:repeat(16,1fr);gap:.6em}
.step{display:grid;gap:.35em;justify-items:center}
.step:nth-child(4n+1) .sub{color:var(--ink)}
.step button{width:70%;height:1.5em;border-radius:.3em;background:var(--key);box-shadow:0 .12em 0 #000;display:grid;place-items:center}
.step button i{width:70%;height:.45em;border-radius:.2em;background:var(--c);box-shadow:0 0 .6em var(--c);opacity:.18}
.step button.on i{opacity:1}
.step button.cur{background:var(--ink)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.nav .btn:last-child{grid-column:1/-1}

/* potards */
.knob{width:5.4em;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--case-hi) 0 38%,var(--key-lo) 40% 62%,var(--case-hi) 64%,var(--key-lo));
  box-shadow:0 .5em .9em #000,inset 0 .1em 0 var(--dim);position:relative;transform:rotate(var(--a,0deg));touch-action:none;cursor:grab}
.knob::after{content:"";position:absolute;left:50%;top:7%;width:.35em;height:24%;margin-left:-.175em;border-radius:1em;background:var(--ink)}
.knob.big{width:7em}

/* milieu */
.mid{display:grid;grid-template-columns:8em 33em 1fr 7em;gap:1.3em}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:.8em;height:33em}
.strip .bar{border-radius:.5em;background:repeating-linear-gradient(var(--key) 0 3.9em,var(--key-lo) 3.9em 4.125em);box-shadow:inset 0 0 .6em #000;touch-action:none;cursor:pointer}
.strip .leds{border-radius:.4em;background:var(--key-lo);display:grid;align-content:space-around;justify-items:center;
  background-image:radial-gradient(circle,var(--red) 0 .14em,transparent .18em);background-size:1.2em 1.1em;background-position:-.25em 0;background-repeat:repeat-y}
.strip .leds b{font-size:.62em;color:var(--dim);margin-left:1.2em}
.strip .leds b.on{color:var(--screen);background:var(--amber);border-radius:.3em;padding:.1em .3em}
.left{display:grid;gap:1.2em;align-content:start}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em;height:33em}
.pad{position:relative;border-radius:.5em;background:var(--key-lo);box-shadow:0 .2em 0 #000;touch-action:none;transition:background .35s}
.pad::before{content:"";position:absolute;inset:.45em;border:.32em solid var(--c);border-radius:.4em;box-shadow:0 0 .9em var(--c),inset 0 0 .9em var(--c);opacity:.9}
.pad b{position:absolute;left:1.6em;top:1.5em;font-size:.72em;color:var(--dim)}
.pad i{position:absolute;left:1.9em;right:1.9em;bottom:1.8em;font-size:.6em;font-style:normal;font-weight:700;letter-spacing:.04em;color:var(--ink);opacity:.7;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.pad.sel b{color:var(--ink)}
.pad.muted::before{opacity:.18}
.pad.hit{background:var(--c);transition:none}
.brand{display:flex;align-items:center;gap:1.5em;height:3.2em}
.brand .btn{width:6em;height:2.6em}
.logo{font-family:var(--f-logo);font-size:3.4em;line-height:1;letter-spacing:.04em;color:var(--dim)}
.logo em{font-style:normal;color:var(--red)}
.center{display:grid;gap:1.2em;align-content:start;min-width:0}
.knobs{display:flex;flex-direction:column;align-items:center;justify-content:space-between}

/* écran */
.screen{height:25.6em;border-radius:.5em;border:.5em solid #000;background:var(--screen);font-family:var(--f-screen);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden}
.s-head,.s-foot{display:flex;justify-content:space-between;gap:1em;padding:.55em 1em;border-bottom:.1em solid var(--line);white-space:nowrap;overflow:hidden}
.s-foot{border:0;border-top:.1em solid var(--line);color:var(--dim)}
.s-head span,.s-foot span{font-size:.95em;overflow:hidden;text-overflow:ellipsis} .s-head b{color:var(--amber)}
.s-q{display:grid;grid-template-columns:.9fr repeat(4,1.2fr);border-top:.1em solid var(--line)}
.s-q span{font-size:.78em;padding:.4em .6em;white-space:nowrap;overflow:hidden;color:var(--dim)}
.s-q span:first-child{color:var(--amber)} .s-q b{color:var(--cyan)}
.view{display:grid;gap:.7em;padding:.7em;min-height:0;min-width:0}
.v2{grid-template-columns:1fr 1.1fr}
.v1{grid-template-rows:auto minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:.45em;min-height:0;min-width:0}
.cap{font-size:.72em;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.tb{display:flex;flex-wrap:wrap;gap:.4em}
.sb{font-size:.8em;font-weight:700;padding:.35em .7em;border:.1em solid var(--line);border-radius:.3em;background:var(--key-lo);color:var(--ink)}
.sb.on{background:var(--amber);color:var(--screen);border-color:var(--amber)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.15em;border:.1em solid var(--line);border-radius:.3em;padding:.3em;min-height:0}
.li{flex:none;text-align:left;font-size:.82em;padding:.3em .5em;border-radius:.2em;background:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li:hover{background:var(--line)} .li.dir{color:var(--amber)} .li.info{color:var(--dim);white-space:normal;cursor:default}
.lrow{display:flex;gap:.2em;flex:none} .lrow .li{flex:1;min-width:0} .lrow .x{flex:none;color:var(--red)}
.screen input{font:inherit;font-size:.9em;background:var(--key-lo);border:.1em solid var(--line);color:var(--ink);padding:.35em .5em;border-radius:.3em;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em}
.map div{border:.1em solid var(--c);border-radius:.25em;display:grid;place-items:center;min-width:0;overflow:hidden;transition:background .3s}
.map div span{font-size:.66em;font-weight:700;text-align:center;line-height:1.05}
.map div.hit{background:var(--c);color:var(--screen);transition:none}
.now{display:grid;grid-template-rows:1fr 2.2fr;gap:.6em;min-width:0;min-height:0}
.cw{position:relative;min-height:0;min-width:0;border:.1em solid var(--line);border-radius:.3em;overflow:hidden}
.cw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* pavé */
.cluster{display:grid;grid-template-columns:repeat(7,1fr) 3.4em;gap:.6em}
.cluster .pm{grid-column:8;grid-row:1/4;display:grid;gap:.6em}

/* grille haut-parleur */
.grille{height:6.5em;border-radius:.5em;background:radial-gradient(circle,#000 0 .13em,transparent .16em) 0 0/.5em .5em,var(--key);position:relative;box-shadow:inset 0 .2em .5em #000}
.grille::after{content:"";position:absolute;left:50%;top:0;width:9em;height:2.6em;margin-left:-4.5em;background:var(--case);clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.hint{max-width:1180px;margin:14px auto 0;color:var(--dim);font-size:15px;letter-spacing:.02em;line-height:1.45}
.hint kbd,.hint b{font-family:var(--f-screen);color:var(--ink);font-weight:500}

/* téléphone : la façade s'empile, écran en premier */
@container (max-width:720px){
  .dev{font-size:2.35cqw;padding:1.4em;gap:1em}
  .mid{grid-template-columns:minmax(0,1fr);gap:1em}
  .strip,.grille{display:none}
  .center{order:-1}
  .knobs{flex-direction:row}
  .knob,.knob.big{width:5em}
  .pads{height:auto;aspect-ratio:1}
  .top{grid-template-columns:minmax(0,1fr);order:2}
  .top .ctl{grid-auto-flow:column;justify-content:start;align-items:center;gap:1em}
  .r16{grid-template-columns:repeat(8,1fr)}
  .nav{grid-template-columns:repeat(3,1fr)} .nav .btn:last-child{grid-column:auto}
}

/* ---------- disposition tactile plein écran ---------- */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:var(--case)}
.app{height:100%;box-sizing:border-box;display:grid;gap:.6em;font-size:min(2.5vw,15px);
  padding:calc(.6em + env(safe-area-inset-top,0px)) calc(.6em + env(safe-area-inset-right,0px)) calc(.6em + env(safe-area-inset-bottom,0px)) calc(.6em + env(safe-area-inset-left,0px));
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto auto minmax(0,1fr)}
.btn{height:4em} .btn span{font-size:1em}
.t-top{display:flex;gap:.8em;align-items:center;min-width:0}
.t-top .logo{font-size:2.3em}
.t-trans{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.4em}
.screen{font-size:1.1em;height:23em;border-width:.3em}
.t-tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.3em}
.t-tabs .btn{height:3.3em}
.t-knobs{display:flex;align-items:center;justify-content:space-between;gap:.4em;padding-inline:.4em}
.t-knobs #knobs{display:contents}
.knob{width:4.6em} .knob.big{width:5.6em}
.t-fn{display:grid;grid-template-rows:auto auto;grid-auto-flow:column;grid-auto-columns:6.6em;gap:.4em;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding-bottom:.2em}
.t-fn::-webkit-scrollbar{display:none}
.t-steps{grid-template-columns:repeat(8,minmax(0,1fr));gap:.4em}
.t-steps .step{gap:.15em} .t-steps .step button{width:100%;height:2.3em} .t-steps .sub{font-size:.8em}
.pads{height:auto;min-height:0;gap:.6em}
.pad b{font-size:1em;left:1.2em;top:1.1em} .pad i{font-size:.85em;left:1.4em;right:1.4em;bottom:1.3em}
.sb{padding:.5em .8em} .li{padding:.5em .6em}
@media (orientation:landscape){
  .app{font-size:min(1.25vw,2.1vh,16px);grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;column-gap:1em}
  .t-steps{grid-column:1;grid-row:1;grid-template-columns:repeat(16,minmax(0,1fr));align-self:center}
  .pads{grid-column:1;grid-row:2/6}
  .t-top{grid-column:2;grid-row:1} .screen{grid-column:2;grid-row:2;height:auto;min-height:0}
  .t-tabs{grid-column:2;grid-row:3} .t-knobs{grid-column:2;grid-row:4} .t-fn{grid-column:2;grid-row:5}
}
</style>
</head>
<body>
<div class="app">
 <div class="t-top"><div class="logo"><em>TNT</em>44</div><div class="t-trans" id="tTrans"></div></div>
 <div class="screen">
     <div class="s-head"><span>PROJET <b id="hName"></b></span><span>SÉQ <b id="hSeq"></b></span><span>KIT <b id="hKit"></b></span><span><b id="bpmTxt"></b> BPM</span></div>
     <div class="view v2" id="vMain"><div class="map" id="map"></div><div class="now"><div class="cw"><canvas id="scope"></canvas></div><div class="cw"><canvas id="grid"></canvas></div></div></div>
     <div class="view v2" id="vSons" hidden>
      <div class="col"><div class="cap">Kits intégrés</div><div class="tb" id="kitTb"></div><div class="cap">Tes sons, vers le pad sélectionné</div><div class="tb" id="sonsTb"></div><div class="cap" id="srvTxt"></div></div>
      <div class="col"><div class="cap" id="libPath">Bibliothèque</div><div class="list" id="libList"></div></div>
     </div>
     <div class="view v1" id="vEdit" hidden><div class="tb" id="editTb"></div><div class="cw"><canvas id="editCv"></canvas></div></div>
     <div class="view v1" id="vAcid" hidden><div class="tb" id="acidTb"></div><div class="cw"><canvas id="acidCv"></canvas></div></div>
     <div class="view v1" id="vMix" hidden><div class="cap">Glisse une barre pour le volume, touche la case du bas pour couper</div><div class="cw"><canvas id="mixCv"></canvas></div></div>
     <div class="view v1" id="vFx" hidden><div class="tb" id="fxTb"></div><div class="cw"><canvas id="xyCv"></canvas></div></div>
     <div class="view v2" id="vProj" hidden>
      <div class="col"><label class="cap" for="pName">Nom du projet</label><input id="pName" maxlength="40" autocomplete="off"><div class="tb" id="projTb"></div>
       <label class="cap" for="pKey">Mot de passe serveur</label><input id="pKey" type="password" autocomplete="off"><div class="cap" id="modeTxt"></div></div>
      <div class="col"><div class="cap">Projets sauvés</div><div class="list" id="projList"></div></div>
     </div>
     <div class="s-q" id="qRow"></div>
     <div class="s-foot"><span id="status">Play pour lancer le live d'exemple</span><span>VOL <b id="volTxt">80</b></span></div>
    </div>
 <div class="t-tabs" id="tTabs"></div>
 <div class="t-knobs"><div class="knob" id="vol" role="slider" tabindex="0" aria-label="Volume général" aria-valuemin="0" aria-valuemax="100"></div><div id="knobs"></div></div>
 <div class="t-fn" id="tFn"></div>
 <div class="r16 t-steps" id="steps"></div>
 <div class="pads" id="pads"></div>
 <div hidden><div id="fn"></div><div id="nav"></div><div id="cluster"><div id="pm"></div></div><div id="brand"></div><div id="leds"></div></div>
</div>
<input type="file" id="file" multiple accept="audio/*,.wav,.mp3,.ogg,.flac,.aif,.aiff,.m4a,.zip" hidden>
<script>
const $=id=>document.getElementById(id),API=window.TNT44_API||null;
const COL={r:'var(--red)',a:'var(--amber)',c:'var(--cyan)',m:'var(--mag)'};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),pad2=n=>String(n).padStart(2,'0'),pct=v=>Math.round(v*100);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const K={r:cssv('--red'),a:cssv('--amber'),c:cssv('--cyan'),m:cssv('--mag'),green:cssv('--green'),line:cssv('--line'),ink:cssv('--ink'),dim:cssv('--dim'),bg:cssv('--screen')};
const store={get(k){try{return JSON.parse(localStorage.getItem('tnt44:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('tnt44:'+k,JSON.stringify(v))}catch(e){}}};
const idb={db:null,open(){return this.db||(this.db=new Promise((ok,ko)=>{const r=indexedDB.open('tnt44',1);r.onupgradeneeded=()=>r.result.createObjectStore('samples');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))},
  async run(mode,fn){const d=await this.open();return new Promise((ok,ko)=>{const q=fn(d.transaction('samples',mode).objectStore('samples'));q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})},
  put(k,v){return this.run('readwrite',s=>s.put(v,k))},get(k){return this.run('readonly',s=>s.get(k))},keys(){return this.run('readonly',s=>s.getAllKeys())},del(k){return this.run('readwrite',s=>s.delete(k))}};
const AUD=/\.(wav|mp3|ogg|flac|m4a|aiff?)$/i;
const nice=n=>String(n).replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().slice(0,16).toUpperCase();
const fslug=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'tnt44';

/* ---------- kits synthétisés (aucun fichier audio) ---------- */
const T=(f0,f1,d,g=1,w='sine',sw=.12,x)=>Object.assign({w,f:[f0,f1,sw],d,g},x),N=(d,g,x)=>Object.assign({w:'noise',d,g},x),V=(n,c,L,drive)=>({n,c,L,drive});
const clap=[0,.012,.024].map(at=>N(.03,.7,{bp:[1200,1.2],at})).concat(N(.22,.7,{bp:[1200,1.2],at:.03}));
const chord=(fs,d,g,lp)=>fs.flatMap(f=>[T(f,f,d,g,'sawtooth',.1,{lp,det:-12}),T(f,f,d,g,'sawtooth',.1,{lp,det:12})]);
const KITS={
TRIBE:[
 V('KICK TRIBE','r',[T(260,48,.28,1,'sine',.07),N(.012,.5,{hp:3000})],6),
 V('KICK BASS','r',[T(240,46,.5,1,'sine',.06,{h:.3})],10),
 V('BASSE OFF','r',[T(55,55,.16,.9,'sawtooth',.1,{lp:[900,120,2]})],3),
 V('BASSE 2','r',[T(41.2,41.2,.22,.9,'square',.1,{lp:[600,100,3]})],3),
 V('CH FERMÉ','c',[N(.04,.55,{hp:8500})]),
 V('CH OUV.','c',[N(.22,.5,{hp:7500})]),
 V('CLAP','a',clap),
 V('SNARE TEK','a',[T(240,170,.1,.5,'triangle'),N(.16,.8,{bp:[2200,.6]})],2),
 V('TOM B','m',[T(140,80,.3,.9,'sine',.15)],2),
 V('TOM M','m',[T(200,110,.25,.9,'sine',.12)],2),
 V('TOM A','m',[T(300,170,.2,.9,'sine',.1)],2),
 V('WOOD','m',[T(520,380,.08,.6,'triangle',.03)]),
 V('RIDE','c',[N(.5,.3,{bp:[9000,2]}),T(5200,5200,.4,.04,'square')]),
 V('CRASH','c',[N(1.4,.5,{hp:4500})]),
 V('STAB','a',chord([220,261.6,329.6],.28,.14,[4000,500,2])),
 V('SIRÈNE','m',[T(500,1500,.9,.22,'square',.85,{lp:[3000,3000,1],h:.7})])],
ACIDCORE:[
 V('KICK CORE','r',[T(400,50,.45,1,'sine',.09,{h:.3}),N(.01,.6,{hp:2500})],25),
 V('KICK PIEP','r',[T(700,60,.4,1,'sine',.14,{h:.25})],30),
 V('KICK COURT','r',[T(300,55,.18,1,'sine',.05)],15),
 V('BASSE CORE','r',[T(50,50,.22,1,'sawtooth',.1,{lp:[1200,150,4]})],12),
 V('CH FERMÉ','c',[N(.035,.6,{hp:9000})]),
 V('CH OUV.','c',[N(.2,.5,{hp:8000})]),
 V('CLAP DIST','a',clap,4),
 V('SNARE CORE','a',[T(260,150,.12,.6,'triangle'),N(.2,.9,{bp:[2600,.5]})],6),
 V('SCREECH','m',[T(880,440,.35,.4,'sawtooth',.3,{lp:[6000,800,12]})],5),

      :fetch(API+'?a=file&p='+encodeURIComponent(url),{headers:{'X-TNT44-Key':encodeURIComponent(key)}}).then(r=>{if(!r.ok)throw new Error('http');return r.arrayBuffer()});
    bufCache.set(url,raw.then(ab=>new Promise((ok,ko)=>ctx.decodeAudioData(ab,ok,ko))).catch(e=>{bufCache.delete(url);throw e}))}

      try{await idb.put(dir+'/'+f.name,ab);got.push(['idb:'+dir+'/'+f.name,f.name])}
      catch(e){const b=await new Promise((ok,ko)=>ctx.decodeAudioData(ab,ok,ko));if(n<16){setBuf((sel+n)%16,b,f.name,null);n++}}}
    else say('Format non pris en charge : '+f.name)}catch(e){say('Import impossible : '+f.name)}}
  for(const[u,name]of got){if(n>=16)break;if(await loadUrl((sel+n)%16,u,name))n++}
  if(n||packed)say((n?n+' son(s) posé(s) à partir du pad '+pad2(sel+1)+'. ':'')+(packed?'Pack extrait : '+packed+' sons dans /'+shown:''));
  if(view==='sons')libLoad(shown)}
$('file').addEventListener('change',e=>importFiles(e.target.files));
const cat=a=>{const o=new Float32Array(a.reduce((n,x)=>n+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
function wavBlob(c,sr){
  const n=c[0].length,k=c.length,v=new DataView(new ArrayBuffer(44+n*k*2)),w=(o,s)=>[...s].forEach((x,i)=>v.setUint8(o+i,x.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*k*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,k,true);v.setUint32(24,sr,true);v.setUint32(28,sr*k*2,true);
  v.setUint16(32,k*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*k*2,true);
  let o=44;for(let i=0;i<n;i++)for(let j=0;j<k;j++){const s=clamp(c[j][i],-1,1);v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}
  return new Blob([v],{type:'audio/wav'})}
async function download(blob,name){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()){
    const data=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(blob)}),F=C.Plugins.Filesystem;let r;
    try{r=await F.writeFile({path:'TNT44/'+name,data,directory:'DOCUMENTS',recursive:true});say('Enregistré dans Documents/TNT44/'+name)}
    catch(e){try{r=await F.writeFile({path:name,data,directory:'CACHE'});say('Fichier prêt : choisis où l\'envoyer')}catch(e2){return say('Écriture du fichier impossible')}}
    try{await C.Plugins.Share.share({title:name,url:r.uri})}catch(e){}
    return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function micToggle(){
  init();
  if(mic){const m=mic;mic=null;m.sp.disconnect();m.src.disconnect();m.stream.getTracks().forEach(t=>t.stop());const d=cat(m.chunks);if(!d.length)return say('Rien enregistré');
    const b=ctx.createBuffer(1,d.length,ctx.sampleRate);b.getChannelData(0).set(d);const i=sel,name='micro-'+Date.now()+'.wav';setBuf(i,b,'MICRO '+pad2(i+1),null);say('Prise micro posée sur le pad '+pad2(i+1));
    if(canWrite())try{const up=await upload([new File([wavBlob([d],ctx.sampleRate)],name)],'micro');if(up.files[0]){P.pads[i].url=up.files[0].url;bufCache.set(up.files[0].url,Promise.resolve(b));say('Prise micro sauvée dans /micro')}}catch(e){say(e.message)}
    render();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return say('Micro indisponible ici : il faut une adresse en https');
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),src=ctx.createMediaStreamSource(stream),sp=ctx.createScriptProcessor(4096,1,1),z=ctx.createGain();z.gain.value=0;
    src.connect(sp);sp.connect(z);z.connect(ctx.destination);mic={stream,src,sp,chunks:[]};sp.onaudioprocess=e=>{if(mic)mic.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
    say('Micro : enregistrement vers le pad '+pad2(sel+1)+'… reclique sur Micro pour arrêter')}catch(e){say('Micro refusé ou indisponible')}
  render()}
function wavToggle(){
  if(!wavRec){wavRec={L:[],R:[]};return say('Enregistrement du live… reclique sur Rec WAV pour arrêter')}
  const r=wavRec;wavRec=null;if(!r.L.length)return say('Rien enregistré');
  download(wavBlob([cat(r.L),cat(r.R)],ctx.sampleRate),'tnt44-live-'+fslug(P.name)+'.wav');say('Live enregistré : le fichier WAV se télécharge')}
async function exportWav(){
  init();const Sq=seq(),sd=stepDur(),n=Sq.len,tot=n+64,sr=ctx.sampleRate,live=E;say('Export en cours…');
  const oc=new OfflineAudioContext(2,Math.ceil(tot*sd*sr),sr);
  try{E=build(oc,false);ctx=oc;applyAll();
    for(let k=0;k<tot;k++){const s=k%n,t=k*sd+(s%2?P.swing*sd*.6:0);for(let p=0;p<16;p++){const v=Sq.d[p][s];if(v)trigger(p,v&127,t,v>>7)}acidStep(t,Sq.a[s],sd)}}
  finally{E=live;ctx=live.ctx}
  const buf=await oc.startRendering(),a=Math.round(n*sd*sr),len=Math.round(64*sd*sr);
  download(wavBlob([buf.getChannelData(0).subarray(a,a+len),buf.getChannelData(1).subarray(a,a+len)],sr),fslug(P.name)+'-seq-'+'abcd'[P.cur]+'-'+P.bpm+'bpm.wav');
  say('Export WAV : 4 mesures de la séquence '+'ABCD'[P.cur]+', calées pour boucler')}

function setProject(o){
  if(playing)stop();const d=newProject();P=Object.assign(d,o);P.acid=Object.assign(ACID0(),o.acid);P.fx=Object.assign(FX0(),o.fx);P.cur=clamp(P.cur|0,0,3);
  BUF.fill(null);RBUF.fill(null);PK.fill(null);undo.length=redo.length=0;sel=0;page=0;cur=-1;nextStep=0;
  P.pads.forEach((p,i)=>{if(!KITS[p.kit]||!KITS[p.kit][p.i]){p.kit='TRIBE';p.i=i}
    if(p.url&&(API||p.url.startsWith('idb:')))loadUrl(i,p.url,p.name,true);else Object.assign(p,{url:null,name:KITS[p.kit][p.i].n,start:0,end:1,grp:0,sync:0,rev:0})});
  padLabels();applyAll();showBpm();syncQ();render()}
const validProject=o=>o&&o.v===1&&Array.isArray(o.pads)&&o.pads.length===16&&Array.isArray(o.seqs)&&o.seqs.length===4&&o.seqs.every(s=>s&&Array.isArray(s.d)&&s.d.length===16&&Array.isArray(s.a)&&s.a.length===32);
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>store.set('session',P),800)}
addEventListener('pagehide',()=>store.set('session',P));document.addEventListener('visibilitychange',()=>{if(document.hidden)store.set('session',P)});
async function projList(){
  let names=[];if(canRead())try{names=(await api('projects')).projects}catch(e){say(e.message)}else names=Object.keys(store.get('projects')||{});
  const el=$('projList');el.textContent='';
  if(!names.length){const d=document.createElement('div');d.className='li info';d.textContent='Aucun projet sauvé pour l\'instant.';el.append(d)}
  names.forEach(n=>{const row=document.createElement('div'),b=document.createElement('button'),x=document.createElement('button');row.className='lrow';b.className='li';x.className='li x';b.textContent=n;x.textContent='✕';x.setAttribute('aria-label','Supprimer '+n);
    b.addEventListener('click',()=>projLoad(n));x.addEventListener('click',()=>{if(x.textContent==='✕'){x.textContent='Supprimer ?';setTimeout(()=>{x.textContent='✕'},3000)}else projDel(n)});row.append(b,x);el.append(row)})}
async function projSave(){
  const name=$('pName').value.trim().slice(0,40)||'LIVE';P.name=name;
  if(canWrite())try{await api('save',{query:{name},post:JSON.stringify(P)});say('Projet « '+name+' » sauvé sur le serveur')}catch(e){say(e.message)}
  else{const all=store.get('projects')||{};all[name]=P;store.set('projects',all);say('Projet « '+name+' » sauvé dans ce navigateur'+(API?' (mot de passe requis pour le serveur)':''))}
  projList()}
async function projLoad(n){
  let o=null;if(canRead())try{o=(await api('load',{query:{name:n}})).project}catch(e){return say(e.message)}else o=(store.get('projects')||{})[n];
  if(!validProject(o))return say('Projet illisible');setProject(o);$('pName').value=P.name;say('Projet « '+P.name+' » chargé')}
async function projDel(n){
  if(canWrite())try{await api('delproject',{query:{name:n},post:'{}'})}catch(e){return say(e.message)}else{const all=store.get('projects')||{};delete all[n];store.set('projects',all)}
  say('Projet « '+n+' » supprimé');projList()}
$('pKey').addEventListener('change',async e=>{key=e.target.value;store.set('key',key);await ping();projList();say(srv.authed?'Mot de passe accepté':'Mot de passe refusé')});
$('pName').addEventListener('change',e=>{P.name=e.target.value.trim().slice(0,40)||'LIVE';render()});

/* ---------- actions des boutons ---------- */
const toggleView=v=>()=>setView(view===v?'main':v);
const seqBtn=k=>()=>{if(copyMode){P.seqs[k]=JSON.parse(JSON.stringify(seq()));copyMode=false;say('Séquence copiée vers '+'ABCD'[k])}
  else if(playing&&k!==P.cur){queued=k;say('Séquence '+'ABCD'[k]+' au prochain tour')}else{P.cur=k;queued=null;say('Séquence '+'ABCD'[k])}};
const ACT={
  'Play':()=>play(false),'Play début':()=>play(true),'Stop':stop,'Tap tempo':tap,
  'Rec':()=>{rec=!rec;say(rec?'Enregistrement armé : joue pendant la lecture':'Enregistrement coupé')},
  '+':()=>setBpm(P.bpm+1),'−':()=>setBpm(P.bpm-1),
  'Effacer':sh=>{pushUndo();if(sh){P.seqs[P.cur]=newSeq();say('Séquence '+'ABCD'[P.cur]+' vidée')}else if(view==='acid'){seq().a.forEach(a=>a.n=-1);say('Ligne acide effacée')}else{seq().d[sel].fill(0);say(pd().name+' : pas effacés (Shift + Effacer vide tout)')}},
  'Répét.':()=>{repeat=!repeat;held.clear();say(repeat?'Répétition '+DIVS[div][0]+' : garde un pad enfoncé':'Répétition coupée')},
  'Plein':()=>{full=!full;say(full?'Pleine puissance : tous les coups à fond':'Vélocité selon la hauteur du toucher')},
  '16 niv.':()=>{lv16=(lv16+1)%3;say(['16 niveaux coupés','16 niveaux de volume pour '+pd().name,'16 notes pour '+pd().name+' : joue-le en mélodie'][lv16])},
  'A':seqBtn(0),'B':seqBtn(1),'C':seqBtn(2),'D':seqBtn(3),
  'Copier':()=>{copyMode=!copyMode;say(copyMode?'Copier : choisis la séquence de destination (A à D)':'Copie annulée')},
  'Métro':()=>{metro=!metro;say(metro?'Métronome en marche':'Métronome coupé')},
  'Div.':()=>{div=(div+7)%8;say('Répétition : '+DIVS[div][0])},
  'Annuler':sh=>sh?unredo(redo,undo,'rétabli'):unredo(undo,redo,'annulé'),
  'Charger':()=>setView('proj'),'Sauver':()=>{if(view==='proj')projSave();else{setView('proj');say('Vérifie le nom puis SAUVER')}},
  'Mute pad':()=>{muteMode=!muteMode;soloMode=false;say(muteMode?'Mute : touche les pads à couper':'Mode mute quitté')},
  'Solo':()=>{soloMode=!soloMode;muteMode=false;if(!soloMode){P.pads.forEach(p=>p.solo=0);for(let j=0;j<17;j++)applyChan(j)}say(soloMode?'Solo : touche les pads à isoler':'Solo quitté')},
  'Q −':()=>{qp=(qp+3)%4;syncQ()},'Q +':()=>{qp=(qp+1)%4;syncQ()},'FX XY':toggleView('fx'),
  'Projet':toggleView('proj'),'Main':()=>setView('main'),'Shift':()=>{shift=!shift;say(shift?'Shift : + Effacer vide la séquence, + Annuler rétablit':'')},
  'Sons':toggleView('sons'),'Édit':toggleView('edit'),'Acid':toggleView('acid'),'Mix':toggleView('mix'),
  '32 pas':()=>{const Sq=seq();pushUndo();if(Sq.len===16){Sq.len=32;if(!Sq.d.some(r=>r.slice(16).some(v=>v))&&!Sq.a.slice(16).some(a=>a.n>=0)){Sq.d.forEach(r=>{for(let s=0;s<16;s++)r[s+16]=r[s]});for(let s=0;s<16;s++)Sq.a[s+16]=Object.assign({},Sq.a[s])}say('Séquence sur 32 pas : ◀ ▶ changent de page')}
    else{Sq.len=16;page=0;if(nextStep>=16)nextStep=0;say('Séquence sur 16 pas')}},
  '◀':()=>{page=0},'▶':()=>{if(seq().len===32)page=1;else say('Passe d\'abord la séquence sur 32 pas')},
  'Chaîne':()=>{chain=!chain;say(chain?'Chaîne : les séquences non vides s\'enchaînent':'Chaîne coupée')},
  'Kit −':()=>loadKit(KITN[(KITN.indexOf(P.kit)+KITN.length-1)%KITN.length]),'Kit +':()=>loadKit(KITN[(KITN.indexOf(P.kit)+1)%KITN.length]),
  'Micro':micToggle,'Importer':()=>$('file').click(),'Rec WAV':wavToggle,
  'Bandeau':()=>{stripFx=!stripFx;say(stripFx?'Bandeau : balayage du filtre':'Bandeau : division de répétition')}};

const KEYS=['KeyZ','KeyX','KeyC','KeyV','KeyA','KeyS','KeyD','KeyF','KeyQ','KeyW','KeyE','KeyR','Digit1','Digit2','Digit3','Digit4'];
addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input'))return;if(e.key==='Shift'){shift=true;render();return}if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'){if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();playing?stop():play(false);return}
  const i=KEYS.indexOf(e.code);if(i>=0){e.preventDefault();padDown(i,110)}});
addEventListener('keyup',e=>{if(e.key==='Shift'){shift=false;render()}const i=KEYS.indexOf(e.code);if(i>=0)held.delete(i)});

/* ---------- affichage ---------- */
function render(){
  const Sq=seq(),p=pd();if(Sq.len===16)page=0;
  $('steps').style.setProperty('--c',view==='acid'?'var(--green)':COL[p.c]);
  stepEls.forEach((b,i)=>{const s=page*16+i,on=view==='acid'?Sq.a[s].n>=0:!!Sq.d[sel][s];b.classList.toggle('on',on);b.classList.toggle('cur',s===cur);b.setAttribute('aria-pressed',on)});
  const L={Play:playing,Rec:rec,'Répét.':repeat,Plein:full,'16 niv.':lv16,Copier:copyMode,'Métro':metro,'Mute pad':muteMode,Solo:soloMode,Shift:shift,'32 pas':Sq.len===32,'Chaîne':chain,Micro:mic,'Rec WAV':wavRec,
    Projet:view==='proj',Main:view==='main',Sons:view==='sons','Édit':view==='edit',Acid:view==='acid',Mix:view==='mix','FX XY':view==='fx',Bandeau:stripFx,'▶':page===1,'◀':Sq.len===32&&page===0};
  'ABCD'.split('').forEach((l,k)=>{L[l]=k===P.cur;BTN[l].classList.toggle('q',k===queued)});
  for(const l in L)BTN[l].classList.toggle('on',!!L[l]);
  $('hName').textContent=P.name;$('hSeq').textContent='ABCD'[P.cur]+(Sq.len===32?(page?' · 17-32':' · 1-16'):'');$('hKit').textContent=P.kit;
  padEls.forEach((el,i)=>{el.classList.toggle('muted',!!P.pads[i].mute);el.classList.toggle('sel',i===sel)});
  ledEls.forEach((b,i)=>b.classList.toggle('on',i===div));
  tbRefresh();const dr={main:drawGrid,edit:drawEdit,acid:drawAcid,mix:drawMix,fx:drawXY}[view];if(dr)dr();
  saveSoon()}
function touch(){lastHit=performance.now();if(!raf)raf=requestAnimationFrame(draw)}
function draw(){
  raf=0;if(view!=='main')return;const[g,w,h]=cvs('scope');g.lineWidth=Math.max(1.5,h/40);g.strokeStyle=K.c;g.beginPath();
  if(E){const d=new Uint8Array(E.an.fftSize);E.an.getByteTimeDomainData(d);for(let i=0;i<d.length;i++){const x=i/(d.length-1)*w,y=h/2+(d[i]-128)/128*h*.9;i?g.lineTo(x,y):g.moveTo(x,y)}}
  else{g.moveTo(0,h/2);g.lineTo(w,h/2)}
  g.stroke();if(E&&performance.now()-lastHit<2500)raf=requestAnimationFrame(draw)}

/* ---------- démarrage ---------- */
const sess=store.get('session');if(validProject(sess))setProject(sess);else{padLabels();showBpm()}
qReady=true;syncQ();render();draw();ping().then(()=>{if(view==='sons')libLoad(lib.dir)});
addEventListener('resize',()=>{render();touch()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);

/* ---------- disposition tactile : les boutons rejoignent leurs barres ---------- */
(()=>{const mv=(id,ls)=>ls.forEach(l=>$(id).append(BTN[l]));
mv('tTrans',['Play','Stop','Rec','Play début','Tap tempo']);
mv('tTabs',['Main','Sons','Édit','Acid','Mix','FX XY','Projet']);
mv('tFn',['A','B','C','D','Répét.','Div.','Plein','16 niv.','Mute pad','Solo','Effacer','Annuler','Shift','Copier','32 pas','Chaîne','◀','▶','−','+','Kit −','Kit +','Q −','Q +','Métro','Importer','Micro','Rec WAV','Sauver','Charger']);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('orientationchange',()=>setTimeout(()=>{render();touch()},350));
say('Play pour lancer le live d\'exemple');render()})();
</script>
